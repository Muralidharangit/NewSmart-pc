<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINBET - Gaming Platform</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Unified Master Stylesheet -->
    <link rel="stylesheet" href="./style.css">
    <script>
        // Default router: redirect to registration flow if no session exists, or open lobby
        window.addEventListener('DOMContentLoaded', () => {
            const hasRegistered = localStorage.getItem('winbet_machine_name');
            if (hasRegistered) {
                const mode = localStorage.getItem('winbet_machine_type') || 'smartpc';
                window.location.replace(`GameLobby.html?mode=${mode}`);
            } else {
                window.location.replace('Register.html');
            }
        });
    </script>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="text-center p-4">
        <!-- <div class="mb-3">
            <img src="./IMG/logo.png" alt="WINBET Logo" class="brand-logo-img logo-lg">
        </div> -->
        <p class="text-dim small mb-4">Loading Gaming Station Terminal...</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="Register.html" class="btn-winbet px-4 py-2 text-decoration-none">
                <i class="fa-solid fa-key me-1"></i> Registration Portal
            </a>
            <a href="GameLobby.html" class="btn btn-outline-warning rounded-pill px-4 py-2 text-decoration-none" style="border-color: #f5b300; color: #ffdc69;">
                <i class="fa-solid fa-gamepad me-1"></i> Gaming Lobby
            </a>
        </div>
    </div>
</body>
</html>
